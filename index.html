<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>A Little Question ❤️</title>

<style>
    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
    }

    body {
        min-height: 100vh;
        overflow: hidden;
        font-family: "Trebuchet MS", Arial, sans-serif;
        background:
            radial-gradient(circle at 20% 20%, rgba(255,255,255,.9), transparent 25%),
            radial-gradient(circle at 80% 30%, rgba(255,220,230,.8), transparent 30%),
            linear-gradient(135deg, #ffd9e4, #fff4f7);
        display: flex;
        justify-content: center;
        align-items: center;
        color: #472532;
    }

    .hearts {
        position: fixed;
        inset: 0;
        pointer-events: none;
        overflow: hidden;
    }

    .heart {
        position: absolute;
        bottom: -50px;
        font-size: 20px;
        opacity: .65;
        animation: floatUp linear infinite;
    }

    @keyframes floatUp {
        0% {
            transform: translateY(0) rotate(0deg);
            opacity: 0;
        }
        10% {
            opacity: .7;
        }
        100% {
            transform: translateY(-115vh) rotate(25deg);
            opacity: 0;
        }
    }

    .card {
        width: min(92%, 520px);
        background: rgba(255,255,255,.88);
        border-radius: 30px;
        padding: 45px 30px;
        text-align: center;
        box-shadow:
            0 25px 70px rgba(117, 45, 75, .18),
            0 8px 25px rgba(117, 45, 75, .1);
        backdrop-filter: blur(10px);
        position: relative;
        z-index: 5;
        transition: transform .3s ease;
    }

    .emoji {
        font-size: 60px;
        margin-bottom: 15px;
        animation: bounce 2s infinite;
    }

    @keyframes bounce {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-8px); }
    }

    h1 {
        font-size: clamp(28px, 7vw, 42px);
        line-height: 1.15;
        margin-bottom: 15px;
    }

    .subtitle {
        font-size: 18px;
        line-height: 1.5;
        color: #795563;
        margin-bottom: 30px;
    }

    .button-area {
        height: 130px;
        position: relative;
        width: 100%;
    }

    button {
        border: none;
        cursor: pointer;
        font-family: inherit;
        font-size: 18px;
        font-weight: bold;
        padding: 15px 27px;
        border-radius: 999px;
        transition:
            transform .2s ease,
            box-shadow .2s ease,
            left .15s ease,
            top .15s ease;
        user-select: none;
        -webkit-tap-highlight-color: transparent;
    }

    #yesBtn {
        background: linear-gradient(135deg, #ff4f81, #ff739b);
        color: white;
        box-shadow: 0 8px 20px rgba(255, 79, 129, .3);
        position: absolute;
        left: 50%;
        top: 48px;
        transform: translateX(-115%);
    }

    #yesBtn:hover {
        transform: translateX(-115%) scale(1.08);
        box-shadow: 0 12px 25px rgba(255, 79, 129, .4);
    }

    #noBtn {
        background: #f1e7eb;
        color: #70525e;
        position: absolute;
        left: 50%;
        top: 48px;
        transform: translateX(15%);
    }

    .small {
        font-size: 13px;
        color: #a07988;
        margin-top: 10px;
    }

    .success {
        display: none;
    }

    .success .big-heart {
        font-size: 90px;
        animation: heartPop .8s ease;
        margin-bottom: 10px;
    }

    @keyframes heartPop {
        0% {
            transform: scale(.2);
            opacity: 0;
        }
        70% {
            transform: scale(1.2);
        }
        100% {
            transform: scale(1);
            opacity: 1;
        }
    }

    .success h2 {
        font-size: clamp(30px, 8vw, 48px);
        margin-bottom: 15px;
    }

    .success p {
        font-size: 19px;
        line-height: 1.5;
        color: #795563;
    }

    .confetti {
        position: fixed;
        width: 10px;
        height: 16px;
        top: -20px;
        z-index: 20;
        pointer-events: none;
        animation: confettiFall 3s linear forwards;
    }

    @keyframes confettiFall {
        0% {
            transform: translateY(0) rotate(0deg);
            opacity: 1;
        }
        100% {
            transform: translateY(110vh) rotate(720deg);
            opacity: 0;
        }
    }

    @media (max-width: 500px) {
        .card {
            padding: 35px 20px;
        }

        .subtitle {
            font-size: 16px;
        }

        .button-area {
            height: 150px;
        }
    }
</style>
</head>

<body>

<div class="hearts" id="hearts"></div>

<div class="card" id="card">

    <!-- QUESTION SCREEN -->
    <div id="questionScreen">

        <div class="emoji">💌</div>

        <h1>Will you go to prom with me?</h1>

        <p class="subtitle">
            I have a very important question for you... ❤️
        </p>

        <div class="button-area" id="buttonArea">

            <button id="yesBtn">
                YES ❤️
            </button>

            <button id="noBtn">
                NO 😭
            </button>

        </div>

        <div class="small">
            Choose wisely... 👀
        </div>

    </div>


    <!-- SUCCESS SCREEN -->
    <div class="success" id="successScreen">

        <div class="big-heart">💖</div>

        <h2>I KNEW IT!</h2>

        <p>
            You just made my day. 🥹❤️
            <br><br>
            Prom is going to be amazing.
        </p>

    </div>

</div>


<script>

    const yesBtn = document.getElementById("yesBtn");
    const noBtn = document.getElementById("noBtn");
    const buttonArea = document.getElementById("buttonArea");

    const questionScreen = document.getElementById("questionScreen");
    const successScreen = document.getElementById("successScreen");


    /* =========================
       FLOATING HEARTS
       ========================= */

    const heartsContainer = document.getElementById("hearts");

    const heartSymbols = ["❤️", "💕", "💗", "💖", "💘"];

    for (let i = 0; i < 25; i++) {

        const heart = document.createElement("div");

        heart.className = "heart";

        heart.textContent =
            heartSymbols[Math.floor(Math.random() * heartSymbols.length)];

        heart.style.left = Math.random() * 100 + "%";

        heart.style.animationDuration =
            (6 + Math.random() * 8) + "s";

        heart.style.animationDelay =
            (Math.random() * 8) + "s";

        heart.style.fontSize =
            (14 + Math.random() * 22) + "px";

        heartsContainer.appendChild(heart);
    }


    /* =========================
       NO BUTTON ESCAPES
       ========================= */

    function moveNoButton() {

        const areaRect = buttonArea.getBoundingClientRect();

        const buttonWidth = noBtn.offsetWidth;
        const buttonHeight = noBtn.offsetHeight;

        const maxX = areaRect.width - buttonWidth;
        const maxY = areaRect.height - buttonHeight;

        const randomX =
            Math.max(0, Math.random() * maxX);

        const randomY =
            Math.max(0, Math.random() * maxY);

        noBtn.style.left = randomX + "px";
        noBtn.style.top = randomY + "px";

        noBtn.style.transform = "none";
    }


    /* Desktop:
       Run away when the cursor gets close. */

    document.addEventListener("mousemove", function(event) {

        const rect = noBtn.getBoundingClientRect();

        const buttonCenterX =
            rect.left + rect.width / 2;

        const buttonCenterY =
            rect.top + rect.height / 2;

        const distance =
            Math.sqrt(
                Math.pow(event.clientX - buttonCenterX, 2) +
                Math.pow(event.clientY - buttonCenterY, 2)
            );

        if (distance < 120) {
            moveNoButton();
        }

    });


    /* Mobile:
       Run away when she tries to touch it. */

    noBtn.addEventListener("touchstart", function(event) {

        event.preventDefault();

        moveNoButton();

    });


    /* Also run if someone somehow clicks it. */

    noBtn.addEventListener("click", function(event) {

        event.preventDefault();

        moveNoButton();

    });


    /* =========================
       YES BUTTON
       ========================= */

    yesBtn.addEventListener("click", function() {

        questionScreen.style.display = "none";

        successScreen.style.display = "block";

        createConfetti();

    });


    /* =========================
       CONFETTI
       ========================= */

    function createConfetti() {

        const pieces = 100;

        for (let i = 0; i < pieces; i++) {

            const confetti =
                document.createElement("div");

            confetti.className = "confetti";

            confetti.style.left =
                Math.random() * 100 + "vw";

            confetti.style.animationDuration =
                (2 + Math.random() * 2) + "s";

            confetti.style.animationDelay =
                Math.random() * .7 + "s";

            const colors = [
                "#ff4f81",
                "#ff9fba",
                "#ffd166",
                "#8bd3dd",
                "#cdb4db",
                "#90be6d"
            ];

            confetti.style.background =
                colors[Math.floor(Math.random() * colors.length)];

            confetti.style.transform =
                "rotate(" + Math.random() * 360 + "deg)";

            document.body.appendChild(confetti);

            setTimeout(function() {
                confetti.remove();
            }, 5000);
        }

    }

</script>

</body>
</html>
